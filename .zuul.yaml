- project:
    queue: blazar
    templates:
      - check-requirements
      - openstack-cover-jobs
      - openstack-python3-jobs
      - publish-openstack-docs-pti
      - release-notes-jobs-python3
    check:
      jobs:
        - blazar-tempest-plugin-base:
            irrelevant-files: &irrelevant-files
              - ^\.gitignore$
              - ^\.gitireview$
              - ^.*\.rst$
              - ^api-ref/.*$
              - ^doc/.*$
              - ^releasenotes/.*$
              - ^blazar/tests/.*$
              - ^tox\.ini$
        - blazar-tempest-plugin-ipv6-only:
            irrelevant-files: *irrelevant-files
    gate:
      jobs:
        - blazar-tempest-plugin-base:
            irrelevant-files: *irrelevant-files
        - blazar-tempest-plugin-ipv6-only:
            irrelevant-files: *irrelevant-files
